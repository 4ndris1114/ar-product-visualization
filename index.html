<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rigby Spawner</title>
  <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
  <style>
    #sceneContainer {
      display: none; /* Initially hidden */
    }
  </style>
</head>
<body>
  <h1>Rigby Spawner</h1>
  <button id="startXR">Start WebXR</button>
  <button id="showHelipad">Helipad</button>

  <div id="sceneContainer">
    <a-scene renderer="colorManagement: true;">
      <a-entity geometry="primitive: box" gltf-model="helipad.glb" position="0 1 0" rotation="0 0 0"></a-entity>
      <a-entity geometry="primitive: box" gltf-model="porsche911.glb" position="0 1 0"></a-entity>

      <!-- Camera rig for user's viewpoint -->
      <a-entity id="cameraRig" position="0 1 0">
        <a-camera wasd-controls="acceleration: 50" look-controls="pointerLockEnabled: true; sensitivity: 0.5">
          <a-entity tap-controller="selectOnUp: true"></a-entity>
        </a-camera>
      </a-entity>
    </a-scene>
  </div>

  <script type="module">
    import * as THREE from './libs/js/three.module.js';
    import { GLTFLoader } from './libs/js/GLTFLoader.js';

    async function activateXR() {
      const canvas = document.createElement("canvas");
      document.body.appendChild(canvas);
      const gl = canvas.getContext("webgl2", { xrCompatible: true }) || canvas.getContext("webgl", { xrCompatible: true });
      const scene = new THREE.Scene();

      const directionalLight = new THREE.DirectionalLight(0xffffff, 0.3);
      directionalLight.position.set(10, 15, 10);
      scene.add(directionalLight);

      const renderer = new THREE.WebGLRenderer({
        alpha: true,
        preserveDrawingBuffer: true,
        canvas: canvas,
        context: gl
      });
      renderer.autoClear = false;

      const camera = new THREE.PerspectiveCamera();
      camera.matrixAutoUpdate = false;

      const session = await navigator.xr.requestSession("immersive-ar", { requiredFeatures: ['hit-test'] });
      session.updateRenderState({ baseLayer: new XRWebGLLayer(session, gl) });

      const referenceSpace = await session.requestReferenceSpace('local');
      const viewerSpace = await session.requestReferenceSpace('viewer');
      const hitTestSource = await session.requestHitTestSource({ space: viewerSpace });

      const loader = new GLTFLoader();
      let reticle;
      loader.load("reticle.glb", function (glb) {
        reticle = glb.scene;
        reticle.visible = false;
        scene.add(reticle);
      });

      const light = new THREE.HemisphereLight(0xffffbb, 0x080820, 1);
      scene.add(light);

      let rigby;
      loader.load("rigby.glb", function (glb) {
        rigby = glb.scene;
      });

      session.addEventListener("select", () => {
        if (rigby && reticle.visible) {
          const clone = rigby.clone();
          clone.position.copy(reticle.position);
          scene.add(clone);
        }
      });

      const onXRFrame = (time, frame) => {
        session.requestAnimationFrame(onXRFrame);
        gl.bindFramebuffer(gl.FRAMEBUFFER, session.renderState.baseLayer.framebuffer);
        const pose = frame.getViewerPose(referenceSpace);
        if (pose) {
          const view = pose.views[0];
          const viewport = session.renderState.baseLayer.getViewport(view);
          renderer.setSize(viewport.width, viewport.height);
          camera.matrix.fromArray(view.transform.matrix);
          camera.projectionMatrix.fromArray(view.projectionMatrix);
          camera.updateMatrixWorld(true);
          const hitTestResults = frame.getHitTestResults(hitTestSource);
          if (hitTestResults.length > 0 && reticle) {
            const hitPose = hitTestResults[0].getPose(referenceSpace);
            reticle.visible = true;
            reticle.position.set(hitPose.transform.position.x, hitPose.transform.position.y, hitPose.transform.position.z);
            reticle.updateMatrixWorld(true);
          }
          renderer.render(scene, camera);
        }
      };
      session.requestAnimationFrame(onXRFrame);
    }

    document.getElementById("startXR").addEventListener("click", activateXR);
    document.getElementById("showHelipad").addEventListener("click", () => {
      document.getElementById("sceneContainer").style.display = "block";
      console.log("Show helipad");
      console.log(document.getElementById("sceneContainer").style.display);
    });
  </script>
</body>
</html>
